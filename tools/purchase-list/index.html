<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>購買清單 — UH TRPG Tool Library</title>
  <link rel="stylesheet" href="../../shared/styles.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <p><a href="../../index.html">← Library</a></p>
    <h1>購買清單</h1>
    <p class="lead">記錄預計購買項目，自動計算所需支線、分數與經驗。</p>

    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="list">購買清單</button>
      <button class="tab" data-tab="branches">購買分支</button>
    </nav>

    <!-- 購買清單 -->
    <section id="list" class="tab-panel">
      <!-- 目前擁有 -->
      <section class="card">
        <h2>目前擁有</h2>
        <div class="row">
          <div>
            <label for="own-branch">支線</label>
            <input id="own-branch" type="text" value="" placeholder="如 D, DD">
          </div>
          <div>
            <label for="own-points">分數</label>
            <input id="own-points" type="number" min="0" value="0">
          </div>
          <div>
            <label for="own-xp">經驗 (XP)</label>
            <input id="own-xp" type="number" min="0" value="0">
          </div>
        </div>
      </section>

      <!-- 預計購買項目 -->
      <section class="card">
        <h2>預計購買項目</h2>
        <div class="table-wrapper">
          <table id="items-table">
            <thead>
              <tr>
                <th>分類</th>
                <th>項目</th>
                <th>購買目標</th>
                <th>支線</th>
                <th>分數</th>
                <th>經驗</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="items-body"></tbody>
          </table>
        </div>
        <button id="add-item" style="margin-top:0.75rem;">+ 新增項目</button>
      </section>

      <!-- 小計 -->
      <section class="card">
        <h2>小計</h2>
        <div class="row">
          <div>
            <label>支線 (剩餘)</label>
            <p id="subtotal-branch" class="result">—</p>
          </div>
          <div>
            <label>分數 (剩餘)</label>
            <p id="subtotal-points" class="result">0</p>
          </div>
          <div>
            <label>經驗 (剩餘)</label>
            <p id="subtotal-xp" class="result">0</p>
          </div>
        </div>
        <p id="balance" class="note" style="margin-top:0.75rem;"></p>
      </section>

      <!-- 儲存/清除/匯出/匯入 -->
      <div class="row" style="margin-top:1rem;">
        <button id="save">儲存</button>
        <button id="copy-clipboard">複製到剪貼簿</button>
        <button id="clear" style="background:#cf222e;">清除全部</button>
      </div>
    </section>

    <!-- 購買分支 -->
    <section id="branches" class="tab-panel" hidden>
      <section class="card">
        <h2>購買分支</h2>
        <p class="note">儲存不同的購買方案，方便比較與評估。</p>
        <div class="row" style="margin-bottom:0.75rem;">
          <div>
            <label for="branch-name">分支名稱</label>
            <input id="branch-name" type="text" placeholder="如 方案A">
          </div>
          <div style="flex:0 0 auto;">
            <button id="save-branch" style="margin-top:1.2rem;">儲存為分支</button>
          </div>
        </div>
        <div id="branches-list"></div>
      </section>
    </section>
  </main>
  <script type="module" src="script.js"></script>
</body>
</html>
