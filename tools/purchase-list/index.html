<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>購買清單 — UH TRPG Tool Library</title>
  <link rel="stylesheet" href="../../shared/styles.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <p><a href="../../index.html">← Library</a></p>
    <h1>購買清單</h1>
    <p class="lead">記錄預計購買項目，自動計算所需支線、分數與經驗。</p>

    <!-- 目前擁有 -->
    <section class="card">
      <h2>目前擁有</h2>
      <div class="row">
        <div>
          <label for="own-branch">支線</label>
          <input id="own-branch" type="text" value="" placeholder="如 D, DD">
        </div>
        <div>
          <label for="own-points">分數</label>
          <input id="own-points" type="number" min="0" value="0">
        </div>
        <div>
          <label for="own-xp">經驗 (XP)</label>
          <input id="own-xp" type="number" min="0" value="0">
        </div>
      </div>
    </section>

    <!-- 預計購買項目 -->
    <section class="card">
      <h2>預計購買項目</h2>
      <div id="items-container"></div>
      <button id="add-item" style="margin-top:0.75rem;">+ 新增項目</button>
    </section>

    <!-- 小計 -->
    <section class="card">
      <h2>小計</h2>
      <div class="row">
        <div>
          <label>支線</label>
          <p id="subtotal-branch" class="result">—</p>
        </div>
        <div>
          <label>分數</label>
          <p id="subtotal-points" class="result">0</p>
        </div>
        <div>
          <label>經驗 (XP)</label>
          <p id="subtotal-xp" class="result">0</p>
        </div>
      </div>
      <p id="balance" class="note" style="margin-top:0.75rem;"></p>
    </section>

    <!-- 儲存/清除 -->
    <div class="row" style="margin-top:1rem;">
      <button id="save">儲存</button>
      <button id="clear" style="background:#cf222e;">清除全部</button>
    </div>
  </main>
  <script type="module" src="script.js"></script>
</body>
</html>
